# NOTE: This repository does not support or use automated GitHub Actions for CI/CD builds.
# This workflow file is kept strictly for manual dispatch / reference and push triggers are disabled.

name: Release Multi-Arch

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release
        run: cargo build --workspace --release
      - name: Build AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./scripts/build.sh --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: sipster-x86_64.AppImage
          path: target/sipster-x86_64.AppImage

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release binary
        run: cargo build -p sipster-ui --release
      - name: Rename binary
        run: cp target/release/sipster-ui ./sipster-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: sipster-aarch64
          path: ./sipster-aarch64

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: sipster-x86_64.exe
          - target: i686-pc-windows-msvc
            name: sipster-x86.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release exe
        run: cargo build -p sipster-ui --target ${{ matrix.target }} --release
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/sipster-ui.exe ./${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ./${{ matrix.name }}

  publish:
    needs: [build-linux-x86_64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          gh release upload "$TAG_NAME" * --clobber || gh release create "$TAG_NAME" * --title "Sipster $TAG_NAME" --generate-notes
