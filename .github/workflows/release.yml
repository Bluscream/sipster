# Sipster release workflow.
#
# NOTE: this repository does not rely on GitHub Actions for its real builds —
# releases are produced locally in the `build-box` distrobox via
# `scripts/build.sh`. Push triggers are therefore disabled and this workflow is
# manual-dispatch only. It is kept correct and runnable because it doubles as
# executable documentation of the release process.
#
# All artifacts follow the project naming rule: sipster-{os}-{arch}.{ext}
#
# Coverage note: this workflow builds the subset GitHub has runners for
# (linux x86_64 + aarch64, windows x86_64 + x86). The i686/armv7 Linux builds
# and the aarch64 Windows build exist only in `scripts/build.sh`, which is why
# a real release is cut locally from the build-box.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The same gate as `./scripts/build.sh check`. A tag that cannot pass it
  # must not become a release.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  linux-x86_64:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the tagged commit, never from a moving branch.
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        # cmake + libopus toolchain for the Opus codec; alsa for cpal.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake pkg-config
      - name: Install appimagetool
        run: |
          wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Build binary and AppImage
        # `appimage` is a real target in build.sh and produces
        # dist/sipster-linux-x86_64.AppImage
        run: |
          ./scripts/build.sh x86_64-linux
          ./scripts/build.sh appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            dist/sipster-linux-x86_64
            dist/sipster-linux-x86_64.AppImage
          if-no-files-found: error

  linux-aarch64:
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake pkg-config
      - name: Build release binary
        run: cargo build --release -p sipster-ui
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/sipster-ui dist/sipster-linux-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64
          path: dist/sipster-linux-aarch64
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: sipster-windows-x86_64.exe
          - target: i686-pc-windows-msvc
            name: sipster-windows-x86.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cmake
        # libopus is built from source via cmake for the Opus codec.
        uses: lukka/get-cmake@latest
      - name: Build release exe
        run: cargo build -p sipster-ui --target ${{ matrix.target }} --release
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sipster-ui.exe" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -la dist
          # Create the release if it does not exist yet, then upload assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Sipster $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
