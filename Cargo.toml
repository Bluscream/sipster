[workspace]
members = [
    "crates/sipster-core",
    "crates/sipster-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sipster Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.10"
uuid = { version = "1.13", features = ["v4"] }

# SIP, SDP & RTP media crates (100% pure Rust)
rsip = "0.4.0"
sdp = "0.17"
rtp = "0.17"
audio-codec = "0.4"
cpal = "0.18"
