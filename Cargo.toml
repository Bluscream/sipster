[workspace]
members = [
    "crates/sipster-core",
    "crates/sipster-ui",
    "crates/sipster-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sipster Authors"]
license = "Unlicense"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unused_async = "allow"
must_use_candidate = "allow"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"


[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.10"
uuid = { version = "1.13", features = ["v4"] }

# SIP, SDP & RTP media crates (100% pure Rust)
rsip = "0.4.0"
sdp = "0.17"
rtp = "0.17"
audio-codec = "0.4"
cpal = "0.18"

# --- Profile Optimizations for Disk Space & Build Speed ---

[profile.dev]
# Line numbers only for panic stack traces; cuts debug symbols by ~60%
debug = 1

[profile.dev.package."*"]
# Zero debug symbols for third-party dependencies (wgpu, iced, tokio, etc.)
debug = 0

[profile.release]
# Strip symbol tables and enable thin LTO for small, lean binaries
strip = true
lto = "thin"
codegen-units = 1
