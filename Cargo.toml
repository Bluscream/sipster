[workspace]
members = [
    "crates/sipster-core",
    "crates/sipster-integrations",
    "crates/sipster-ui",
    "crates/sipster-tests",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["Sipster Authors"]
license = "Unlicense"
repository = "https://github.com/Bluscream/sipster"
homepage = "https://github.com/Bluscream/sipster"
readme = "README.md"
keywords = ["sip", "voip", "softphone", "telephony", "fritzbox"]
categories = ["multimedia::audio", "network-programming"]
# `File::try_lock` (single-instance guard) and let-chains in the 2021 edition.
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unused_async = "allow"
must_use_candidate = "allow"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"


[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Evolution Data Server is only reachable over D-Bus, and its address book
# objects live only as long as the client connection that opened them — so a
# `gdbus` subprocess per call cannot work. zbus is pure Rust, so it adds no C
# build dependency to the cross-compiled targets; it is Linux-only all the same.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.10"
uuid = { version = "1.13", features = ["v4", "serde"] }
toml = "1.0"
rust-i18n = "3.1"

# SIP engine: rvoip provides the transaction/dialog/registrar/media stack behind
# a softphone-oriented Endpoint API.
#
# Pinned to an upstream git rev rather than crates.io 0.3.8 for API currency
# (0.3.9 line: Endpoint API, cleaner codec feature gating). The `opus` feature
# is enabled deliberately: Opus is our preferred codec (best quality) and is
# offered first, with G.711 (PCMU/PCMA, pure Rust) as the universal fallback
# every PBX — including the Fritz!Box — accepts. Opus is backed by libopus,
# built via cmake in the build-box; that C codec dependency is accepted.
rvoip-sip = { git = "https://github.com/eisenzopf/rvoip.git", rev = "ed8100ae9e072af9353580e0d3ce09c1e4523cec", features = ["opus"] }
# OS audio-device bridge (cpal microphone/speaker <-> call AudioStream).
rvoip-audio-device = { git = "https://github.com/eisenzopf/rvoip.git", rev = "ed8100ae9e072af9353580e0d3ce09c1e4523cec" }

# --- Profile Optimizations for Disk Space & Build Speed ---

[profile.dev]
# Line numbers only for panic stack traces; cuts debug symbols by ~60%
debug = 1

[profile.dev.package."*"]
# Zero debug symbols for third-party dependencies (wgpu, iced, tokio, etc.)
debug = 0

[profile.release]
# Strip symbol tables and enable thin LTO for small, lean binaries
strip = true
lto = "thin"
codegen-units = 1
