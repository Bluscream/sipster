[package]
name = "sipster-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Modern pure-Rust desktop GUI client for Sipster"

[lints]
workspace = true

[dependencies]
sipster-core = { path = "../sipster-core" }

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# Pure Rust GUI Framework (Iced)
iced = { version = "0.14", features = ["tokio", "svg", "advanced"] }

# System tray — StatusNotifierItem via ksni (works on KDE Plasma/Wayland
# unlike libayatana-appindicator which silently fails there).
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
# PNG decoding for tray icon pixmap conversion (RGBA → ARGB).
image = { version = "0.25", default-features = false, features = ["png"] }
