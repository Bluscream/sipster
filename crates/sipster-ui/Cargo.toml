[package]
name = "sipster-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Modern pure-Rust desktop GUI client for Sipster"

[lints]
workspace = true

[dependencies]
sipster-core = { path = "../sipster-core" }
sipster-integrations = { path = "../sipster-integrations" }
tokio-stream = { version = "0.1", default-features = false }

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true

# Pure Rust GUI Framework (Iced)
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced"] }

# System tray — StatusNotifierItem via ksni (independent background thread via blocking/async-io)
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# PNG decoding for tray icon pixmap conversion (RGBA → ARGB).
image = { version = "0.25", default-features = false, features = ["png"] }

# Native file dialogs
rfd = "0.17"
