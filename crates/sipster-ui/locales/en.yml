# Sipster English (en) — the fallback locale.
#
# Flat, dotted keys sorted alphabetically. Flat because nesting hid
# duplicate values: the same string reached under two keys in different
# sections without either being visible from the other. Sorted so a key
# is looked up by name rather than by remembering which section it is in.
#
# Every key here must be referenced by a `t!` call; unreferenced keys are
# dead weight that later translations still have to carry.

