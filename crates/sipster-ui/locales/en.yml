# Sipster English (en) — the fallback locale.
#
# Flat and alphabetical. A key is a bare name wherever that name is
# unique — `add_contact` means the same thing whichever window shows it,
# so a prefix would add length without adding meaning. A prefix is kept
# only where two areas need different words for one idea, as a contacts
# count and a call count do.
#
# `tests/locales.rs` enforces all of that, along with duplicate values,
# missing keys, empty values and placeholder mismatches.

